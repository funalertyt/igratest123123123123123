<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Mini Igrica</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #222;
    color: white;
    font-family: sans-serif;
    text-align: center;
  }
  canvas {
    background: #333;
    display: block;
    margin: 20px auto;
    border: 2px solid white;
  }
</style>
</head>
<body>
<h2>Izbegni prepreke! 🕹️ (Koristi strelice)</h2>
<canvas id="game" width="500" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let player = { x: 50, y: 180, size: 20, color: 'lime', speed: 4 };
let obstacles = [];
let score = 0;
let gameOver = false;

function spawnObstacle() {
  let y = Math.random() * (canvas.height - 20);
  obstacles.push({ x: canvas.width, y: y, size: 20, color: 'red', speed: 3 });
}

function update() {
  if (gameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // pomeranje igraca
  if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed;
  if (keys['ArrowDown'] && player.y < canvas.height - player.size) player.y += player.speed;
  if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
  if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;

  // crtanje igraca
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // azuriranje i crtanje prepreka
  for (let i = 0; i < obstacles.length; i++) {
    let o = obstacles[i];
    o.x -= o.speed;
    ctx.fillStyle = o.color;
    ctx.fillRect(o.x, o.y, o.size, o.size);

    // detekcija sudara
    if (o.x < player.x + player.size &&
        o.x + o.size > player.x &&
        o.y < player.y + player.size &&
        o.y + o.size > player.y) {
      gameOver = true;
    }
  }

  // uklanjanje prepreka koje su iza ekrana
  obstacles = obstacles.filter(o => o.x + o.size > 0);

  // rezultat
  score++;
  ctx.fillStyle = 'white';
  ctx.font = '16px Arial';
  ctx.fillText('Rezultat: ' + score, 10, 20);

  if (!gameOver) requestAnimationFrame(update);
  else {
    ctx.fillStyle = 'yellow';
    ctx.font = '30px Arial';
    ctx.fillText('Kraj igre! Rezultat: ' + score, 80, 200);
  }
}

// kontrole
let keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// pokretanje igre
setInterval(spawnObstacle, 1000);
update();
</script>
</body>
</html>
